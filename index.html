<style>
:root{--bg:#f2f5f7;--card:#fff;--tx:#18213f;--mut:#667089;--br:#dfe4ea;--ac:#1f3a8a;--acs:#e3e9fb;--tq:#14a39a;--wa:#d97706;--da:#dc2626;--ok:#14a39a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f36;--tx:#e8ecf8;--mut:#93a0c0;--br:#27304c;--ac:#8fa8ff;--acs:#222c52;--tq:#35c9bf;--ok:#35c9bf;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f36;--tx:#e8ecf8;--mut:#93a0c0;--br:#27304c;--ac:#8fa8ff;--acs:#222c52;--tq:#35c9bf;--ok:#35c9bf;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.7 Vazirmatn,Tahoma,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px 14px}
h1{font-size:18px;margin:6px 0 12px;font-weight:800}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--br);border-radius:10px;padding:9px 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.amt{font-size:24px;font-weight:800;text-align:center;direction:ltr}
.hint{text-align:center;color:var(--mut);font-size:13px;min-height:22px;margin-top:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--br);background:var(--bg);color:var(--tx);border-radius:20px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.btn{width:100%;border:0;background:var(--ac);color:var(--bg);font:inherit;font-weight:600;border-radius:12px;padding:12px;margin-top:12px;cursor:pointer}
.big{font-size:30px;font-weight:800;line-height:1.3}
.mut{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--br);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--tq);border-radius:6px}
.bar.w i{background:var(--wa)}.bar.d i{background:var(--da)}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tx{padding:9px 0;border-top:1px solid var(--br)}.tx:first-child{border-top:0}
.x{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer;padding:2px 8px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nav button{border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer}
.alert{border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;border:1px solid}
.alert.w{background:#fef3c7;color:#92400e;border-color:#fcd34d}.alert.d{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .alert.w{background:#3b2a0a;color:#fcd34d;border-color:#6b4a0f}:root:not([data-theme="light"]) .alert.d{background:#3d1417;color:#fca5a5;border-color:#7f1d1d}}
.tabs{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--br);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;padding:10px 0;cursor:pointer}
.tabs button.on{color:var(--ac);font-weight:800}
.ltr{direction:ltr;text-align:left}.ok{color:var(--ok)}.neg{color:var(--da)}.ci{width:auto;border:0;background:none;padding:0;font:inherit;font-size:16px;text-align:center;color:inherit}.chip .x{padding:0 2px}
.tl{max-height:384px;overflow-y:auto;overscroll-behavior:contain;background:var(--card);border:1px solid var(--br);border-radius:12px}
.tr{border-bottom:1px solid var(--br)}.tr:last-child{border-bottom:0}
.trs{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;height:63px;padding:0 12px;border:0;background:none;font:inherit;color:inherit;text-align:right;cursor:pointer}
.trs b:last-child{font-size:16px;white-space:nowrap}
.tr.op{background:var(--acs)}.trd{padding:2px 12px 12px;font-size:13px;color:var(--mut)}
select{padding:9px 6px}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--tx);font-size:14px}.chk input{width:20px;height:20px;padding:0;flex:0 0 auto}.wh{color:var(--tx)}.tx:not(.ex) .det{display:none}.gr{color:#15803d}.rd{color:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gr{color:#4ade80}:root:not([data-theme="light"]) .rd{color:#f87171}}
svg text{fill:var(--tx);font-family:inherit}
.tabs button{font-size:11px;line-height:1.4;padding:7px 1px}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;z-index:9}
</style>

 <div class="card"><b>پشتیبان‌گیری</b><div class="mut">فایل اکسل شامل همه تراکنش‌ها، موجودی حساب‌ها و بدهی‌ها. چیزی پاک نمی‌شود.</div><button class="btn" onclick="exportXl()">دانلود اکسل پشتیبان</button></div>
 <div class="card"><b>بستن دوره مالی</b><div class="mut">ابتدا اکسل دوره ذخیره می‌شود؛ اگر ذخیره لغو شود چیزی پاک نمی‌شود. حساب‌ها و افراد بدون تغییر می‌مانند.</div>
 <label class="chk"><input type="checkbox" ${CP.zero?'checked':''} onchange="CP.zero=this.checked"> موجودی همه حساب‌ها صفر شود</label>
 <label class="chk"><input type="checkbox" ${CP.carry?'checked':''} onchange="CP.carry=this.checked"> بدهی و طلب به دوره بعد منتقل شود (${fa(ls)} نفر)</label>
 <div class="mut">${fa(S.tx.length)} تراکنش پاک می‌شود. اگر بدهی‌ها منتقل نشوند، حساب همه افراد صفر می‌شود.</div>
 <button class="btn" style="background:var(--da);color:#fff" onclick="closeP()">${CF?'مطمئنی؟ دوباره بزن تا دوره بسته شود':'بستن دوره مالی'}</button></div>`}
function cloudSave(){if(!CL)return;clearTimeout(CT);CT=setTimeout(async()=>{const g={meta:JSON.stringify({acc:S.acc,ppl:S.ppl,cats:S.cats,src:S.src,bud:S.bud})},m={};
 S.tx.forEach(t=>{const k='tx_'+t.d.slice(0,7).replace('-','_');(m[k]=m[k]||[]).push(t)});Object.keys(m).forEach(k=>g[k]=JSON.stringify(m[k]));
 try{for(const k of Object.keys(g))if(CL.sent[k]!==g[k]){await CL.col.doc(k).set({j:g[k]});CL.sent[k]=g[k]}
  for(const k of Object.keys(CL.sent))if(!(k in g)){await CL.col.doc(k).delete();delete CL.sent[k]}CL.err=0}
 catch(e){if(!CL.err++)toast('ذخیره ابری انجام نشد؛ فعلاً فقط روی این دستگاه ذخیره می‌شود')}},900)}
async function initCloud(){try{if(!window.claude||!claude.use)return;const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;
 const col=db.collection('data/users/'+id),sent={};CL={col,sent,err:0};const snap=await col.get();let meta=null,tx=[];
 snap.docs.forEach(d=>{const j=(d.data()||{}).j;if(typeof j!=='string')return;sent[d.id]=j;if(d.id==='meta')meta=JSON.parse(j);else if(d.id.startsWith('tx_'))tx=tx.concat(JSON.parse(j))});
 if(meta){S=Object.assign(S,meta,{tx});try{localStorage.setItem('acc2',JSON.stringify(S))}catch(e){}D=newD();render()}else cloudSave()}catch(e){}}
function vDebt(){const ls=S.ppl.map(p=>({p,b:bal(p.id)})).filter(x=>Math.round(x.b)!==0).sort((a,b)=>Math.abs(b.b)-Math.abs(a.b)),due=ls.filter(x=>x.b>0).reduce((s,x)=>s+x.b,0),owe=ls.filter(x=>x.b<0).reduce((s,x)=>s-x.b,0);
 return`<h1>بدهی‌ها و طلب‌ها</h1><div class="card"><div class="row"><div><div class="mut">از دیگران طلب دارم</div><b class="gr">${fa(due)}</b></div><div><div class="mut">به دیگران بدهکارم</div><b class="rd">${fa(owe)}</b></div></div></div>
 ${ls.length?ls.map(({p,b})=>{const open=PX===p.id,rows=open?S.tx.filter(t=>t.p===p.id).sort((a,c)=>(c.d+(c.t||'')).localeCompare(a.d+(a.t||''))||c.id-a.id):[];return`<div class="card" style="padding:0;overflow:hidden"><button class="trs" style="height:62px" onclick="PX=PX==='${p.id}'?null:'${p.id}';render()"><div><b>${esc(p.n)}</b><div class="mut">${b>0?'از او طلب دارم':'به او بدهکارم'}</div></div><b class="${b>0?'gr':'rd'}" style="font-size:18px">${fa(Math.abs(b))} <span class="mut" style="font-weight:400;font-size:12px">تومان</span></b></button>${open?`<div class="tl" id="tl" style="border:0;border-radius:0;border-top:1px solid var(--br)">${rows.map(trRow).join('')}</div>`:''}</div>`}).join(''):'<div class="card mut">با هیچ‌کس طلب یا بدهی نداری. قرض و خرج مشترک را از تب «ثبت» وارد کن.</div>'}`}
function vMore(){return`<h1>بیشتر</h1><div class="mut" style="margin-bottom:8px">${CL?'☁️ داده‌ها در حساب Claude تو ذخیره می‌شوند و با بستن برنامه می‌مانند':'⚠️ داده‌ها فقط روی همین دستگاه ذخیره می‌شوند (ذخیره ابری فعال نیست)'}</div>${[['rep','📊','گزارش ماهانه','درآمد، خرج و سهم هر دسته'],['bud','🎯','بودجه‌بندی','سقف ماهانه و هشدار'],['ppl','👥','افراد و بدهی','طلب و بدهی با دیگران'],['set','⚙️','دسته‌ها و منابع درآمد','ویرایش نام‌ها'],['per','🗓️','بستن دوره مالی و پشتیبان‌گیری','اکسل دوره، ریست تراکنش‌ها و موجودی‌ها']].map(x=>`<button class="card line" style="width:100%;text-align:right;font:inherit;color:inherit;cursor:pointer" onclick="tab='${x[0]}';render();scrollTo(0,0)"><span>${x[1]} <b>${x[2]}</b><div class="mut">${x[3]}</div></span><span class="mut">‹</span></button>`).join('')}`}
function render(){const T=[['add','➕ ثبت'],['tx','📋 تراکنش‌ها'],['bal','💰 موجودی'],['acc','🏦 حساب‌ها'],['more','☰ بیشتر']].flatMap((x,i)=>i===4?[['debt','🤝 بدهی‌ها'],x]:[x]),mt=['rep','bud','ppl','set','per'].includes(tab)?'more':tab,T0=[['add','➕ ثبت'],['rep','📊 گزارش'],['bud','🎯 بودجه'],['acc','🏦 حساب‌ها'],['set','⚙️ دسته‌ها']];
 if(D.c.slice(0,2)!=='__'&&!cOf(D.c).s.length&&!S.cats.some(c=>c.id===D.c))D.c=S.cats[0]?S.cats[0].id:'';
 $('app').innerHTML={add:vAdd,tx:vTx,bal:vBal,acc:vAcc,more:vMore,debt:vDebt,rep:vRep,bud:vBud,ppl:vPpl,per:vPer,set:vSet}[tab]();
 $('tabs').innerHTML=T.map(t=>`<button class="${t[0]===mt?'on':''}" onclick="tab='${t[0]}';render();scrollTo(0,0)">${t[1].replace(' ','<br>')}</button>`).join('')}
render();initCloud();window.addEventListener('online',cloudSave);
</script>
